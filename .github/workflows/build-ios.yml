name: ECO - Crea IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eco-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilazione ECO per iPhone
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Scarica progetto
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verifica regole e compila IPA
        shell: bash
        run: |
          set -o pipefail
          bash scripts/build-ipa.sh 2>&1 | tee build.log
      - name: Scarica IPA da firmare
        uses: actions/upload-artifact@v6
        with:
          name: ECO-IPA-da-firmare
          path: dist/ECO-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Conserva log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ECO-log-compilazione
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
