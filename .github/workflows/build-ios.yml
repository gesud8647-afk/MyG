name: USI Pocket Security - Crea IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocketai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilazione Qwen locale iPhone
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Scarica progetto
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verifica CMake
        run: cmake --version
      - name: Compila motore e app
        shell: bash
        run: |
          set -o pipefail
          bash scripts/build-ipa.sh 2>&1 | tee build.log
      - name: Scarica IPA da firmare
        uses: actions/upload-artifact@v6
        with:
          name: PocketAI-IPA-da-firmare
          path: dist/PocketAI-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Conserva log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: PocketAI-log-compilazione
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
