name: Compila My G per 3uTools

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Compila IPA
        run: bash scripts/build-unsigned-ipa.sh

      - name: Scarica IPA da firmare
        uses: actions/upload-artifact@v4
        with:
          name: MyG-IPA-da-firmare
          path: dist/MyG-unsigned.ipa
          if-no-files-found: error

      - name: Salva log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MyG-log-compilazione
          path: build.log
          if-no-files-found: ignore
